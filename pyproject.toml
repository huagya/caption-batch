[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "caption_batch"
version = "0.3.1"
description = "Batch image captioning (Gemini / OpenRouter) — FastAPI WebUI + Typer CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "typer>=0.12",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "google-genai>=1.0.0",
    "openai>=1.40.0",
    "Pillow>=10.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
caption-batch = "caption_batch.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
